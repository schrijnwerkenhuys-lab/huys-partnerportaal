{% extends "base.html" %}
{% block title %}Welkom | HUYS Partnerportaal{% endblock %}
{% block public %}
<div class="exact-login-shell">
  <div class="exact-login-stage">
    <img class="exact-login-art" src="{{ url_for('static', filename='login-exact.svg') }}" alt="HUYS Partnerportaal">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="exact-login-messages">
        {% for cat,msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="post" class="exact-login-form" aria-label="Aanmelden op het HUYS Partnerportaal">
      <label class="sr-only" for="exact-email">E-mailadres</label>
      <input id="exact-email" class="exact-email" type="email" name="email" placeholder="E-mailadres" autocomplete="email" required>

      <label class="sr-only" for="exact-password">Wachtwoord</label>
      <input id="exact-password" class="exact-password" type="password" name="password" placeholder="Wachtwoord" autocomplete="current-password" required>

      <button class="exact-eye" type="button" aria-label="Wachtwoord tonen" onclick="const p=document.getElementById('exact-password'); p.type=p.type==='password'?'text':'password';"></button>
      <button class="exact-submit" type="submit" aria-label="Inloggen"></button>
    </form>

    <a class="exact-forgot" href="{{ url_for('forgot_password') }}" aria-label="Wachtwoord vergeten?"></a>
    <a class="exact-register" href="{{ url_for('register') }}" aria-label="Maak zelf een account aan"></a>
  </div>
</div>
{% endblock %}
