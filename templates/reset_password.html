{% extends "base.html" %}
{% block public %}
<div class="login-bg"><div class="login-card">
  <div class="brand dark">HUYS<span>PARTNERPORTAAL</span></div>
  <h1>Nieuw wachtwoord</h1>
  <p class="muted">Kies een nieuw wachtwoord van minstens 8 tekens.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat,msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Nieuw wachtwoord</label><input type="password" name="password" minlength="8" required>
    <label>Herhaal wachtwoord</label><input type="password" name="confirm_password" minlength="8" required>
    <button class="primary" type="submit">Wachtwoord opslaan</button>
  </form>
</div></div>
{% endblock %}
